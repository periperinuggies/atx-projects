<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse CCTV — Larsen Ventures</title>
<style>
  /* Lock screen */
  #lockScreen { position:fixed; inset:0; background:#0a0a0a; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  #lockScreen h2 { font-size:0.85rem; font-weight:500; color:#444; letter-spacing:0.1em; text-transform:uppercase; }
  #lockScreen p { font-size:0.75rem; color:#333; }
  #lockScreen input { background:#111; border:1px solid #2a2a2a; color:#ccc; padding:8px 14px; border-radius:4px; font-size:0.85rem; outline:none; text-align:center; }
  #lockScreen input:focus { border-color:#444; }
  #lockScreen button { background:#1a1a1a; border:1px solid #2a2a2a; color:#888; padding:7px 20px; border-radius:4px; font-size:0.8rem; cursor:pointer; }
  #lockScreen button:hover { border-color:#444; color:#ccc; }
  #lockErr { color:#ef4444; font-size:0.75rem; display:none; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #ccc; font-family: system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 0.8rem; font-weight: 500; color: #444; margin-bottom: 12px; letter-spacing: 0.1em; text-transform: uppercase; }

  /* Summary bar */
  #summary { display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .sum-chip { font-size:0.7rem; padding:3px 10px; border-radius:99px; background:#111; border:1px solid #1f1f1f; color:#555; }
  .sum-chip.live  { color:#22c55e; border-color:#1a3a25; }
  .sum-chip.error { color:#ef4444; border-color:#3a1a1a; }
  .sum-chip.wait  { color:#888; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:10px; }

  /* Camera tile */
  .cam { background:#0f0f0f; border-radius:6px; overflow:hidden; border:1px solid #1a1a1a; position:relative; }
  .cam-media { position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  .cam-media video    { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:2; display:none; }
  .cam-media img.snap { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; opacity:0.5; }
  .cam-media .placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:#333; z-index:0; }

  /* Label & status */
  .label { padding:6px 10px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid #111; }
  .ch-name { font-size:0.72rem; color:#555; display:flex; align-items:center; gap:6px; }
  .dot { width:6px; height:6px; border-radius:50%; background:#222; flex-shrink:0; transition:background 0.3s; }
  .dot.live   { background:#22c55e; box-shadow:0 0 5px #22c55e88; }
  .dot.error  { background:#ef4444; }
  .dot.trying { background:#f59e0b; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .mode-badge { font-size:0.65rem; padding:2px 7px; border-radius:4px; background:#111; color:#333; border:1px solid #1a1a1a; }
  .mode-badge.live  { color:#22c55e; border-color:#1a3a25; }
  .mode-badge.error { color:#ef4444; border-color:#3a1a1a; }
  .mode-badge.trying { color:#f59e0b; border-color:#3a2a0a; }

  /* Stage log */
  .stages { padding:0 10px 8px; font-size:0.65rem; color:#333; display:flex; flex-direction:column; gap:2px; }
  .stage { display:flex; align-items:center; gap:6px; }
  .stage .icon { width:12px; text-align:center; }
  .stage.done   .icon::before { content:'✓'; color:#22c55e; }
  .stage.fail   .icon::before { content:'✗'; color:#ef4444; }
  .stage.active .icon::before { content:'⟳'; color:#f59e0b; }
  .stage.wait   .icon::before { content:'·'; color:#333; }
  .stage.done   .txt { color:#3a3a3a; }
  .stage.fail   .txt { color:#6b3030; }
  .stage.active .txt { color:#7a5a20; }

  /* Menu bar */
  #menubar { display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  #menubar .bar-title { font-size:0.8rem; font-weight:500; color:#444; letter-spacing:0.1em; text-transform:uppercase; flex:1; }
  #menubar button { background:#111; border:1px solid #1f1f1f; color:#555; padding:4px 12px; border-radius:4px; font-size:0.72rem; cursor:pointer; display:flex; align-items:center; gap:5px; transition:border-color 0.2s,color 0.2s; }
  #menubar button:hover { border-color:#333; color:#ccc; }
  #menubar button.spinning svg { animation:spin 1s linear infinite; }
  #menubar .bar-clock { font-size:0.68rem; color:#333; font-variant-numeric:tabular-nums; }
  #menubar .bar-sep { width:1px; height:14px; background:#1f1f1f; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="lockScreen">
  <h2>Warehouse CCTV</h2>
  <p>Enter password to continue.</p>
  <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
  <button onclick="checkPw()">Unlock</button>
  <p id="lockErr">Incorrect password.</p>
</div>

<script>
function checkPw(){
  const v=document.getElementById('pwInput').value;
  if(v.toLowerCase()==='batcave'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('pwInput').value='';
  } else {
    document.getElementById('lockErr').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}
</script>

<div id="menubar">
  <span class="bar-title">Warehouse CCTV &nbsp;·&nbsp; Larsen Ventures</span>

  <button id="btnRefreshAll" onclick="reconnectAll(this)" title="Reconnect all cameras">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Refresh All
  </button>

  <div class="bar-sep"></div>

  <button onclick="toggleStages()" id="btnStages" title="Show/hide connection diagnostics">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    Diagnostics
  </button>

  <div class="bar-sep"></div>

  <button onclick="toggleLayout()" id="btnLayout" title="Switch between 2-col and fullwidth layout">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
    </svg>
    Layout
  </button>

  <div class="bar-sep"></div>

  <span class="bar-clock" id="barClock"></span>
</div>

<div id="summary"></div>
<div class="grid" id="grid"></div>

<script>
const BASE    = 'https://streams.larsenfamily.com.au';
const WS_BASE = 'wss://streams.larsenfamily.com.au';
const CHANNELS = 8;
const CHANNEL_NAMES = {1:'Gate', 2:'Door', 3:'Kitchen', 4:'Office', 5:'Workshop', 6:'Mezz', 7:'Channel 7', 8:'Channel 8'};
const CHANNEL_IDS   = {1:'gate', 2:'door', 3:'kitchen', 4:'office', 5:'workshop', 6:'mezz', 7:'ch7', 8:'ch8'};

const state = {}; // per-channel state

function updateSummary() {
  const counts = { live:0, error:0, trying:0 };
  Object.values(state).forEach(s => counts[s.status] = (counts[s.status]||0) + 1);
  const el = document.getElementById('summary');
  el.innerHTML = [
    counts.live  ? `<span class="sum-chip live">✓ ${counts.live} live</span>` : '',
    counts.trying ? `<span class="sum-chip wait">⟳ ${counts.trying} connecting</span>` : '',
    counts.error ? `<span class="sum-chip error">✗ ${counts.error} failed</span>` : '',
    `<span class="sum-chip wait">${new Date().toLocaleTimeString()}</span>`
  ].join('');
}

function setStage(ch, idx, status, text) {
  const el = document.getElementById(`stage-${ch}-${idx}`);
  if (!el) return;
  el.className = `stage ${status}`;
  if (text) el.querySelector('.txt').textContent = text;
}

function setChannelStatus(ch, status, modeText) {
  state[ch].status = status;
  const dot   = document.getElementById(`dot${ch}`);
  const badge = document.getElementById(`badge${ch}`);
  if (dot)   { dot.className = `dot ${status}`; }
  if (badge) { badge.className = `mode-badge ${status}`; badge.textContent = modeText; }
  updateSummary();
}

function showVideo(ch) {
  const v = document.getElementById(`v${ch}`);
  if (v) v.style.display = 'block';
}

function initCam(ch) {
  const id = CHANNEL_IDS[ch] || `ch${ch}`;
  state[ch] = { status: 'trying' };

  const stageList = [
    { id: 0, label: 'WebRTC (lowest latency)' },
    { id: 1, label: 'MSE stream (WebSocket)' },
    { id: 2, label: 'Snapshot fallback' },
  ];

  const stagesHtml = stageList.map(s =>
    `<div class="stage wait" id="stage-${ch}-${s.id}">
       <span class="icon"></span>
       <span class="txt">${s.label}</span>
     </div>`
  ).join('');

  const div = document.createElement('div');
  div.className = 'cam';
  div.dataset.ch = ch;
  div.innerHTML = `
    <div class="cam-media">
      <div class="placeholder">${CHANNEL_NAMES[ch]||'Channel '+ch}</div>
      <img class="snap" id="snap${ch}" style="display:none" />
      <video id="v${ch}" muted playsinline autoplay></video>
    </div>
    <div class="label">
      <span class="ch-name">
        <span class="dot trying" id="dot${ch}"></span>
        ${CHANNEL_NAMES[ch]||'Channel '+ch}
      </span>
      <span class="mode-badge trying" id="badge${ch}">connecting…</span>
    </div>
    <div class="stages" id="stages${ch}" style="display:none">${stagesHtml}</div>`;
  document.getElementById('grid').appendChild(div);

  // Try WebRTC first, fall back to MSE, then snapshots
  tryWebRTC(ch, id);
}

function tryWebRTC(ch, id) {
  setStage(ch, 0, 'active', 'WebRTC — creating peer connection…');
  const video = document.getElementById(`v${ch}`);
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });
  let connected = false;

  const timeout = setTimeout(() => {
    if (!connected) {
      pc.close();
      setStage(ch, 0, 'fail', 'WebRTC timeout (8s)');
      tryMSE(ch, id);
    }
  }, 8000);

  pc.ontrack = e => {
    if (e.track.kind === 'video') {
      clearTimeout(timeout);
      video.srcObject = e.streams[0];
      video.play().catch(() => {});
      video.onplaying = () => {
        if (!connected) {
          connected = true;
          setStage(ch, 0, 'done', 'WebRTC live ✓ (sub-second latency)');
          setStage(ch, 1, 'wait', 'Skipped');
          setStage(ch, 2, 'wait', 'Skipped');
          setChannelStatus(ch, 'live', 'WebRTC');
          showVideo(ch);
        }
      };
    }
  };

  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
      clearTimeout(timeout);
      if (!connected) {
        setStage(ch, 0, 'fail', `WebRTC ICE ${pc.iceConnectionState}`);
        tryMSE(ch, id);
      } else {
        setChannelStatus(ch, 'error', 'reconnecting');
        setTimeout(() => tryWebRTC(ch, id), 5000);
      }
    }
  };

  pc.createOffer().then(offer => pc.setLocalDescription(offer))
    .then(() => fetch(`${BASE}/api/webrtc?src=${id}`, {
      method: 'POST',
      body: new URLSearchParams({ data: btoa(pc.localDescription.sdp) }),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
    }))
    .then(r => r.text())
    .then(sdp => pc.setRemoteDescription({ type: 'answer', sdp: atob(sdp) }))
    .catch(err => {
      clearTimeout(timeout);
      if (!connected) {
        setStage(ch, 0, 'fail', `WebRTC error: ${err.message}`);
        tryMSE(ch, id);
      }
    });
}

function tryMSE(ch, id) {
  const video = document.getElementById(`v${ch}`);
  setStage(ch, 1, 'active', 'Opening WebSocket…');

  if (!window.MediaSource) {
    setStage(ch, 1, 'fail', 'MediaSource not supported');
    tryHLS(ch, id);
    return;
  }

  const ms = new MediaSource();
  video.src = URL.createObjectURL(ms);

  let connected = false;
  let sb, queue = [];
  let ws;

  const wsTimeout = setTimeout(() => {
    if (!connected) {
      setStage(ch, 1, 'fail', 'WebSocket timeout (10s)');
      try { ws && ws.close(); } catch {}
      tryHLS(ch, id);
    }
  }, 10000);

  ms.addEventListener('sourceopen', () => {
    ws = new WebSocket(`${WS_BASE}/api/ws?src=${id}&video=copy&audio=copy`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => setStage(ch, 1, 'active', 'WebSocket open — waiting for codec…');

    ws.onmessage = e => {
      if (typeof e.data === 'string') {
        try {
          const info = JSON.parse(e.data);
          if (info.type === 'mse' && !sb) {
            clearTimeout(wsTimeout);
            setStage(ch, 1, 'active', `Codec: ${info.value} — buffering…`);
            sb = ms.addSourceBuffer(info.value);
            sb.mode = 'segments';
            sb.addEventListener('updateend', () => {
              if (queue.length) sb.appendBuffer(queue.shift());
              if (!connected) {
                connected = true;
                setStage(ch, 1, 'done', `MSE live (${info.value.match(/codecs="([^"]+)"/)?.[1] || 'mp4'})`);
                setChannelStatus(ch, 'live', 'MSE');
                showVideo(ch);
                video.play().catch(() => {});
              }
            });
          }
        } catch {}
      } else if (sb) {
        if (sb.updating) queue.push(e.data);
        else sb.appendBuffer(e.data);
      }
    };

    ws.onerror = () => {
      clearTimeout(wsTimeout);
      setStage(ch, 1, 'fail', 'WebSocket error');
      tryHLS(ch, id);
    };

    ws.onclose = e => {
      if (!connected) {
        clearTimeout(wsTimeout);
        setStage(ch, 1, 'fail', `WebSocket closed (code ${e.code})`);
        tryHLS(ch, id);
      } else {
        setChannelStatus(ch, 'error', 'disconnected');
        setTimeout(() => tryMSE(ch, id), 5000);
      }
    };
  });
}

function tryHLS(ch, id) {
  // Fall back to snapshot polling — still useful if live stream fails
  setStage(ch, 2, 'active', 'Snapshot polling (2s)…');
  startSnapshotPoll(ch, id);
}

const snapPollers = {}; // track per-channel interval IDs

function startSnapshotPoll(ch, id) {
  // Clear any existing poller
  if (snapPollers[ch]) clearInterval(snapPollers[ch]);

  const snapImg = document.getElementById(`snap${ch}`);
  const video   = document.getElementById(`v${ch}`);

  // Hide video element, show snap img
  if (video) video.style.display = 'none';
  if (snapImg) snapImg.style.display = 'block';

  let failures = 0;

  function fetchSnap() {
    const url = `${BASE}/api/frame.jpeg?src=${id}&t=${Date.now()}`;
    const img = new Image();
    img.crossOrigin = null; // plain img load, no CORS
    img.onload = () => {
      failures = 0;
      if (snapImg) snapImg.src = img.src;
      setChannelStatus(ch, 'live', 'Snap ~2s');
      setStage(ch, 2, 'done', 'Snapshot polling live ✓');
    };
    img.onerror = () => {
      failures++;
      if (failures >= 3) {
        setChannelStatus(ch, 'error', 'snapshot failed');
        setStage(ch, 2, 'fail', `Snapshot failed (${failures}x)`);
      }
    };
    img.src = url;
  }

  fetchSnap();
  snapPollers[ch] = setInterval(fetchSnap, 2000);
}

// ── Reconnect a single channel ──────────────────────────────
function reconnectCam(ch) {
  const grid = document.getElementById('grid');
  const tiles = grid.querySelectorAll('.cam');
  // Remove existing tile for this channel (they're in order ch1..ch8)
  const tile = tiles[ch - 1];
  if (tile) {
    // Kill any active video/ws before removing
    const vid = tile.querySelector('video');
    if (vid && vid.srcObject) { vid.srcObject.getTracks().forEach(t => t.stop()); vid.srcObject = null; }
    if (vid) vid.src = '';
    grid.removeChild(tile);
  }
  // Re-insert at correct position
  const nextTile = grid.querySelectorAll('.cam')[ch - 1];
  const newDiv = document.createElement('div'); // temp placeholder
  if (nextTile) grid.insertBefore(newDiv, nextTile);
  else grid.appendChild(newDiv);
  // initCam appends to grid — we want it in position, so remove placeholder after
  grid.removeChild(newDiv);
  // Shift existing tiles right of ch then insert
  initCamAt(ch);
}

// initCamAt: same as initCam but inserts at correct grid position
function initCamAt(ch) {
  const id = CHANNEL_IDS[ch] || `ch${ch}`;
  state[ch] = { status: 'trying' };
  const stageList = [
    { id: 0, label: 'WebRTC (lowest latency)' },
    { id: 1, label: 'MSE stream (WebSocket)' },
    { id: 2, label: 'Snapshot fallback' },
  ];
  const stagesHtml = stageList.map(s =>
    `<div class="stage wait" id="stage-${ch}-${s.id}">
       <span class="icon"></span><span class="txt">${s.label}</span>
     </div>`
  ).join('');
  const div = document.createElement('div');
  div.className = 'cam';
  div.dataset.ch = ch;
  div.innerHTML = `
    <div class="cam-media">
      <div class="placeholder">${CHANNEL_NAMES[ch]||'Channel '+ch}</div>
      <img class="snap" id="snap${ch}" style="display:none" />
      <video id="v${ch}" muted playsinline autoplay></video>
    </div>
    <div class="label">
      <span class="ch-name">
        <span class="dot trying" id="dot${ch}"></span>
        ${CHANNEL_NAMES[ch]||'Channel '+ch}
      </span>
      <span class="mode-badge trying" id="badge${ch}">connecting…</span>
    </div>
    <div class="stages" id="stages${ch}" style="display:${stagesVisible?'flex':'none'}">${stagesHtml}</div>`;
  // Insert in correct position
  const grid = document.getElementById('grid');
  const existing = Array.from(grid.querySelectorAll('.cam'));
  const after = existing.find(el => parseInt(el.dataset.ch) > ch);
  if (after) grid.insertBefore(div, after);
  else grid.appendChild(div);
  // Kick off WebRTC-first connection waterfall
  tryWebRTC(ch, id);
}

// ── Reconnect all cameras ────────────────────────────────────
function reconnectAll(btn) {
  btn.classList.add('spinning');
  // Clear all snapshot pollers
  Object.keys(snapPollers).forEach(ch => { clearInterval(snapPollers[ch]); delete snapPollers[ch]; });
  document.getElementById('grid').innerHTML = '';
  for (let ch = 1; ch <= CHANNELS; ch++) initCamAt(ch);
  setTimeout(() => btn.classList.remove('spinning'), 2000);
}

// ── Toggle diagnostics panel ─────────────────────────────────
let stagesVisible = false;
function toggleStages() {
  stagesVisible = !stagesVisible;
  document.querySelectorAll('.stages').forEach(el => el.style.display = stagesVisible ? 'flex' : 'none');
  document.getElementById('btnStages').style.color = stagesVisible ? '#22c55e' : '';
  document.getElementById('btnStages').style.borderColor = stagesVisible ? '#1a3a25' : '';
}

// ── Toggle layout ─────────────────────────────────────────────
let wideLayout = false;
function toggleLayout() {
  wideLayout = !wideLayout;
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = wideLayout ? '1fr' : 'repeat(auto-fill, minmax(380px, 1fr))';
  document.getElementById('btnLayout').style.color = wideLayout ? '#22c55e' : '';
  document.getElementById('btnLayout').style.borderColor = wideLayout ? '#1a3a25' : '';
}

// ── Clock ─────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('barClock').textContent =
    now.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'Australia/Perth' }) + ' AWST';
}
setInterval(updateClock, 1000);
updateClock();

for (let ch = 1; ch <= CHANNELS; ch++) { state[ch] = {}; initCamAt(ch); }
setInterval(updateSummary, 5000);
</script>
</body>
</html>
